[project]
name = "crs-zone-toolkit"
# La version est lue dans src/crs_zone_toolkit/__init__.py (source unique de
# vérité — __version__ est aussi ce qu'affiche `crszone --version` et ce qui est
# estampillé dans le journal de décision et le rapport HTML).
dynamic = ["version"]
description = "Analyse, recommandation et reprojection CRS pour les couches géospatiales du Québec (fuseaux MTM, Québec Lambert)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Issa Moussahoudou", email = "imoussahoudou@gmail.com" }]
requires-python = ">=3.11"
keywords = ["gis", "crs", "epsg", "mtm", "quebec", "reprojection", "geopandas"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Science/Research",
  "Natural Language :: French",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: GIS",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "geopandas>=1.0",
  "pyogrio>=0.8",
  "shapely>=2.0",
  "pyproj>=3.6",
  "typer>=0.12",
  "rich>=13.0",
  "jinja2>=3.1",
  "matplotlib>=3.8",
  "pywebview>=6.2.1",
]

[project.scripts]
crszone = "crs_zone_toolkit.cli:app"

# gui-scripts (pas scripts) : évite qu'une console s'ouvre derrière la
# fenêtre pywebview une fois le paquet installé (PEP 621).
[project.gui-scripts]
crszone-gui = "crs_zone_toolkit.gui.app:main"

[project.urls]
Homepage = "https://github.com/MascotteIssa/crs-zone-toolkit"
Repository = "https://github.com/MascotteIssa/crs-zone-toolkit"
Documentation = "https://github.com/MascotteIssa/crs-zone-toolkit/blob/main/QUICKSTART.md"
Issues = "https://github.com/MascotteIssa/crs-zone-toolkit/issues"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pre-commit>=3.7",
  "jsonschema>=4.0",
  "pyinstaller>=6.22.2",
]

[build-system]
# >=1.27 : gère la licence en expression SPDX (PEP 639, `license = "MIT"`).
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/crs_zone_toolkit/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/crs_zone_toolkit"]

# Le sdist doit permettre de reconstruire le paquet ET de rejouer la suite de
# tests — rien de plus. Comme la vitrine publique, c'est une LISTE BLANCHE :
# un document nouveau n'y entre que si on l'ajoute ici explicitement, jamais
# par défaut. Son périmètre est ALIGNÉ sur celui de la vitrine
# (PERIMETRE_VITRINE dans scripts/publier_release.py) : ce qui ne sort pas sur
# GitHub ne sort pas non plus sur PyPI — et une version PyPI ne se dépublie
# pas. L'alignement n'est pas une convention mais un invariant testé :
# tests/test_scripts_publier.py échoue si une entrée ci-dessous cesse d'être
# couverte par la liste blanche vitrine (DT-19). Le sdist est délibérément
# PLUS ÉTROIT que la vitrine : il n'emporte ni docs/images/ ni
# docs/exemple_rapport.html (~1,4 Mo de ressources de présentation, que le
# README publié atteint par URL absolue raw.githubusercontent.com).
# `/scripts` est inclus : tests/test_scripts_demos.py (DT-21) en a besoin.
[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/scripts",
  "/docs/DATA_REFERENCE.md",
  "/docs/references.md",
  "/.github",
  "/README.md",
  "/QUICKSTART.md",
  "/LICENSE",
  "/CITATION.cff",
  "/pyproject.toml",
  "/uv.lock",
]
# Deux exclusions résiduelles, pendants exacts de EXCLUSIONS_VITRINE : `/tests`
# et `/scripts` entrent en bloc (la suite doit pouvoir être rejouée, DT-21), or
# `tests/user_test/` contient les protocoles de test manuel internes — ils
# référencent des données git-ignorées qu'un consommateur n'aura jamais — et
# `scripts/construire_exe.py` lit `packaging/crszone-gui.spec`, hors des deux
# périmètres. Toute exclusion sous `/docs` serait morte ici : la liste blanche
# ci-dessus s'en charge déjà.
exclude = [
  "/tests/user_test/**",
  "/scripts/construire_exe.py",
]
# Le `.gitignore` du dépôt entre dans le sdist D'OFFICE : hatchling le
# `force-include` (`builders/sdist.py`, get_default_build_data), ce qui
# court-circuite `include` ET `exclude` — l'y ajouter ne ferait rien. L'archive
# porte donc le `.gitignore` du dépôt où elle est CONSTRUITE. D'où la règle de
# publication : `uv build` puis `twine upload` **depuis le clone vitrine**, qui
# a le sien (`RENOMMAGES_VITRINE` dans `scripts/publier_release.py`). Construit
# depuis le dépôt de développement, le sdist emporterait celui du dev.

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "PTH"]

# typer.Option/Argument sont des appels « immuables » au sens B008 : leur
# valeur par défaut n'est évaluée qu'une fois, à la définition, ce qui est le
# fonctionnement voulu par Typer (pas un piège de mutabilité).
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

# python_version = 3.12 : plancher pour le type-check uniquement (stubs numpy 2.5
# utilisent la syntaxe PEP 695, non parsable par mypy en 3.11). Le plancher
# runtime reste 3.11 (requires-python, ruff target-version=py311, CI sur 3.11).
[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

# geopandas/shapely/pyproj/matplotlib ne fournissent pas de stubs complets :
# on ignore l'absence de stubs pour ces libs (le code du projet reste typé strict).
[[tool.mypy.overrides]]
module = ["geopandas.*", "shapely.*", "pyproj.*", "pyogrio.*", "matplotlib.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --cov=crs_zone_toolkit --cov-report=term-missing"
