# Profil de région : Québec (qc)
# SOURCE DE VÉRITÉ HUMAINE : docs/DATA_REFERENCE.md (v0.2, contre-vérifié MRNF).
# Toute valeur ici est traçable via docs/references.md — ne rien modifier sans
# passer par ces deux documents. Le moteur ne connaît AUCUNE de ces valeurs.

[profil]
id = "qc"
nom = "Québec"
version = "2026.07"
grille = "grille_mtm_qc.geojson"   # générée par `crszone grid` (TP-32) — à produire au Jalon 1
limite = "limite_qc.geojson"       # emprise du Québec pour la découpe (DATA_REFERENCE §6.2)
                                   # dérivée des Découpages administratifs MRNF [REF-15], CC-BY 4.0
# libellé d'affichage (DATA_REFERENCE §4.1) — le nom EPSG officiel reste « NAD83(CSRS)v2 / Quebec Lambert »
etiquette_multi_zones = "Québec Lambert"

[seuils]                            # SPEC §4.3 — défauts à calibrer (TEST_PLAN §5)
part_dominante_min = 0.90
distorsion_max_ppm = 200
n_echantillons = 200

[datum]                             # DATA_REFERENCE §1 et §5
famille_defaut = "csrs"
# Familles exigeant une transformation de datum EXACTE (par grille) — DT-01.
# NAD27 : écart en dizaines de mètres, une approximation « ballpark » est
# inacceptable → apply refuse sans la grille NTv2. Entre familles modernes
# (WGS84/NAD83/CSRS, y compris les réalisations CSRS v2 du Lambert 6622),
# l'écart mesuré est nul à décimétrique → repli accepté, averti et journalisé.
familles_grille_obligatoire = ["nad27"]
[datum.geographiques]
csrs = 4617
nad83 = 4269
nad27 = 4267
wgs84 = 4326

[multi_zones]                       # Québec Lambert — DATA_REFERENCE §4.1
csrs = 6622
nad83 = 32198
nad27 = 32098                       # entrée seulement (règle DATA_REFERENCE §1.5)

# ── Fuseaux MTM 2 à 10 — DATA_REFERENCE §2 ──────────────────────────────
# Bornes de grille alignées sur le réseau de 3° (…, -60, -57, -54).
# Fuseau 2 : MC = -56 (asymétrique dans sa bande) — prescription MRNF
# (codes 26899/32182, « piège du fuseau 2 », DATA_REFERENCE §2).
# epsg_nad27 absent = fuseau sans code NAD27 (fuseaux 7 à 10).

[[fuseaux]]
zone = 2
meridien_central = -56.0
lon_min = -57.0
lon_max = -54.0
epsg_csrs = 26899
epsg_nad83 = 32182
epsg_nad27 = 32082

